name: Build Gemini Live Translate CN fix

on:
  push:
    branches:
      - fix/gemini-3.5-live-translate-language
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out fork
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Normalize source line endings
        run: node scripts/normalize-gemini-fix-source-eol.mjs

      - name: Apply Gemini Live Translate fix
        id: patch
        shell: pwsh
        run: |
          node scripts/apply-gemini-live-translate-fix.mjs *>&1 | Tee-Object -FilePath patch-diagnostics.log
          if ($LASTEXITCODE -eq 0) {
            node scripts/apply-gemini-live-translate-sdk2-fix.mjs *>&1 | Tee-Object -FilePath patch-sdk2-diagnostics.log
          }
          "exit_code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-fix-patch-diagnostics
          path: |
            patch-diagnostics.log
            patch-sdk2-diagnostics.log
          if-no-files-found: warn
          retention-days: 3

      - name: Stop if patching failed
        if: steps.patch.outputs.exit_code != '0'
        shell: pwsh
        run: |
          if (Test-Path patch-diagnostics.log) { Get-Content patch-diagnostics.log }
          if (Test-Path patch-sdk2-diagnostics.log) { Get-Content patch-sdk2-diagnostics.log }
          exit 1

      - name: Verify patched source
        shell: bash
        run: |
          git diff --check
          git diff --stat
          git diff -- src/services/interfaces/IClient.ts src/services/providers/GeminiProviderConfig.ts src/components/MainPanel/MainPanel.tsx src/services/clients/GeminiClient.ts src/services/clients/GeminiClient.test.ts

      - name: Install dependencies
        run: npm ci

      - name: Upgrade Google Gen AI SDK for Live Translate
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --ignore-scripts @google/genai@2.13.0
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('node_modules/@google/genai/package.json','utf8')); console.log('Installed @google/genai', p.version); if (p.version !== '2.13.0') process.exit(1);"
          $matches = Get-ChildItem node_modules/@google/genai -Recurse -File -Include *.js,*.d.ts | Select-String -Pattern 'translationConfig' | Select-Object -First 5
          if (-not $matches) { throw '@google/genai does not contain translationConfig support' }
          $matches | ForEach-Object { Write-Host $_.Path ':' $_.LineNumber ':' $_.Line.Trim() }

      - name: Run Gemini client tests
        run: npm test -- --run src/services/clients/GeminiClient.test.ts

      - name: Build renderer
        run: npm run build
        env:
          CI: false
          VITE_ENVIRONMENT: production
          VITE_ENABLE_ANALYTICS: false

      - name: Package Windows application
        run: npx electron-forge make --arch=x64
        env:
          CI: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_ENVIRONMENT: production
          VITE_ENABLE_ANALYTICS: false

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: Sokuji-Gemini-Live-Translate-CN-portable-sdk2
          path: out/Sokuji-win32-x64/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Sokuji-Gemini-Live-Translate-CN-installer-sdk2
          path: out/make/squirrel.windows/x64/*Setup*.exe
          if-no-files-found: error
          retention-days: 14
